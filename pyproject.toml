[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksef2jpk"
version = "0.1.0"
description = "KSeF to JPK_V7M converter and validation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

authors = [
    { name = "Dariusz Polzer" }
]

dependencies = [
    "defusedxml>=0.7.1",
    "lxml>=5.2.0",
    "pathspec>=0.12.1",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.8",
]

[tool.setuptools]
packages = [
    "ksef2jpk",
    "ksef2jpk.adapter",
    "ksef2jpk.builder",
    "ksef2jpk.classifier",
    "ksef2jpk.generator",
    "ksef2jpk.mapper",
    "ksef2jpk.model",
    "ksef2jpk.parser",
    "ksef2jpk.utils",
    "ksef2jpk.validator",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]
addopts = "-v"
norecursedirs = [
    "venv",
    ".venv",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    "validator/xsd",
]
skips = [
    "B101",
    "B404",
    "B603",
    "B607",
    "B110",
    "B112",
]
